name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: bash apk/build.sh "$GITHUB_WORKSPACE"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-customer-apk
          path: /tmp/app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
